# nginx config for the production frontend image.
#
# Compose does not use this target — it runs the Vite dev server for hot
# reload. This exists so the deployment story is in the repo rather than
# implied.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are content-addressed, so they can be cached
    # indefinitely: a changed file gets a new name rather than a new version of
    # the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the one file that must never be cached. It is what points
    # at the hashed assets, so a stale copy pins the browser to a previous
    # deployment's bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: the server owns no routes but /, so any unmatched
    # path returns the app shell and lets the router resolve it. Without this,
    # reloading on /bookings is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is proxied so the browser makes same-origin requests only, which
    # is what lets the session cookie work without a cross-site exemption. The
    # upstream is named by environment so the same image works in compose and
    # in a hosted environment.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
